<!DOCTYPE html>
<html lang="pl">
<head>
  <title>Założenie konta Stripe | useme.com</title>
</head>
<body>
  <main id="main-content" class="main pb-5">
    <div class="container-lg">
      <div class="jobs-page__content row">
        <div class="col-12 py-md-4">
          <h1 class="jobs__page-title c-dark h2 m-0 p-0">Założenie konta Stripe</h1>
        </div>
        <div class="col-12 col-md-8">
          <div class="jobs-summary">
            <div class="jobs-summary__items">
              <div class="jobs-summary__item">
                <div class="jobs-summary__item-label">Zleceniodawca</div>
                <div class="jobs-summary__item-value">
                  <span>Łukasz</span>
                </div>
              </div>
              <div class="jobs-summary__item">
                <div class="jobs-summary__item-label">Opis</div>
                <div class="jobs-summary__item-text">
                  <p>Zlecę pomoc w założeniu konta Stripe, tak żeby wygenerowany był link do płatności.</p>
                </div>
              </div>
            </div>
            <div class="jobs-summary__brief">
              <div class="jobs-summary__item">
                <div class="jobs-summary__item-label">Opublikowano</div>
                <div class="jobs-summary__item-value">3 miesiące temu</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="jobs-summary jobs-page__sidebar-sticky">
            <div class="jobs-summary__items">
              <div class="jobs-summary__item">
                <div class="jobs-summary__item-label">Budżet</div>
                <div class="h3 jobs-summary__item-value">50,00 PLN</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
