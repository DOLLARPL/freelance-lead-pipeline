<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090a">
<title>{% block title %}Snajper{% endblock %}</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snajper">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/app.css?v=32">
<script src="/static/vendor/htmx.min.js" defer></script>
<script src="/static/app.js?v=24" defer></script>
</head>
<body data-page="{% block page %}{% endblock %}">
{% set kto = current_user() %}
{% if kto %}<div class="userbar"><span class="who">{{ kto }}</span><a class="out" href="/logout">Wyloguj</a></div>{% endif %}
{% block body %}{% endblock %}
{% include "_tabbar.html" %}
<div id="toast" class="toast" hidden></div>
{% block scripts %}{% endblock %}
</body>
</html>
